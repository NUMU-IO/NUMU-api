name: CD

on:
  push:
    branches: [dev, stage, prod]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: numu-io/numu-api

jobs:
  # ===========================================================================
  # Build the Docker image and push to GHCR
  # Runs on every push to stage, prod, or a version tag.
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The branch/tag-based image ref used by deploy jobs below.
      # For branch pushes  → ghcr.io/org/repo:main | ghcr.io/org/repo:stage
      # For version tags   → ghcr.io/org/repo:v1.0.0
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref_tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: ref_tag
        # Use the branch name for branch pushes, or the tag name for tag pushes.
        run: echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_name == 'prod' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy to Test (DigitalOcean Droplet — test.numueg.app)
  # Triggers on push to dev branch.
  # Test stack: project name `numu-test`, env file /opt/numu/.env.test,
  # compose file docker/docker-compose.test.yml. Shared nginx in the staging
  # stack routes test.numueg.app to numu-api-test via the numu-edge network.
  # ===========================================================================
  deploy-test:
    name: Deploy to Test (DO)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync files to test server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} "mkdir -p /opt/numu/docker/postgres"
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "rm -rf /opt/numu/docker/postgres/postgresql.conf /opt/numu/docker/postgres/init-wal-archiving.sh"
          scp -i ~/.ssh/deploy_key \
            docker/docker-compose.test.yml \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/docker-compose.test.yml
          scp -i ~/.ssh/deploy_key docker/postgres/postgresql.conf \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/postgres/postgresql.conf
          scp -i ~/.ssh/deploy_key docker/postgres/init-wal-archiving.sh \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/postgres/init-wal-archiving.sh
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "test -f /opt/numu/.env.test || { echo 'ERROR: /opt/numu/.env.test not found'; exit 1; }"

      # backend-030 / MVP wiring — idempotently upsert WhatsApp + Meta
      # secrets into /opt/numu/.env.test from per-env GitHub secrets.
      # Skips any key whose secret is empty so a half-configured env
      # doesn't blank an existing manual entry. Repeated runs converge.
      - name: Sync WhatsApp/Meta env vars to test droplet
        # Accept BOTH `TEST_*` and `TESTING_*` prefixes — operators have
        # set secrets under each convention over time. GHA's `||`
        # returns the first non-empty value, so whichever was created
        # last wins per-key. `TEST_*` is checked first (canonical), with
        # `TESTING_*` as the fallback so existing setups keep working.
        env:
          REMOTE_FILE: /opt/numu/.env.test
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.TEST_WHATSAPP_ACCESS_TOKEN || secrets.TESTING_WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.TEST_WHATSAPP_PHONE_NUMBER_ID || secrets.TESTING_WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.TEST_WHATSAPP_BUSINESS_ACCOUNT_ID || secrets.TESTING_WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.TEST_WHATSAPP_WEBHOOK_VERIFY_TOKEN || secrets.TESTING_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.TEST_WHATSAPP_APP_SECRET || secrets.TESTING_WHATSAPP_APP_SECRET }}
          WHATSAPP_ENABLED: ${{ secrets.TEST_WHATSAPP_ENABLED || secrets.TESTING_WHATSAPP_ENABLED }}
          META_APP_ID: ${{ secrets.TEST_META_APP_ID || secrets.TESTING_META_APP_ID }}
          WHATSAPP_BUSINESS_API_VERSION: v21.0
        run: |
          SNIPPET=""
          for KEY in WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID \
                     WHATSAPP_BUSINESS_ACCOUNT_ID WHATSAPP_WEBHOOK_VERIFY_TOKEN \
                     WHATSAPP_APP_SECRET WHATSAPP_ENABLED META_APP_ID \
                     WHATSAPP_BUSINESS_API_VERSION; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              SNIPPET+="${KEY}=${VAL}"$'\n'
            else
              echo "[whatsapp-env] $KEY: no secret set; leaving .env.test untouched for this key"
            fi
          done
          if [ -z "$SNIPPET" ]; then
            echo "[whatsapp-env] No WhatsApp/Meta secrets configured — skipping sync."
            exit 0
          fi
          # Bash quirk: `printf | ssh ... <<HEREDOC` has TWO stdin sources
          # (pipe + heredoc). The heredoc wins, the SNIPPET is dropped, the
          # remote `while read` loop iterates zero times and zero secrets
          # are upserted. Fix: embed SNIPPET into the heredoc itself
          # (unquoted outer heredoc → local $SNIPPET expands; quoted INNER
          # heredoc → remote vars stay literal).
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "FILE='${REMOTE_FILE}' bash -s" <<REMOTE_SCRIPT
          set -e
          if [ ! -f "\$FILE" ]; then
            echo "[whatsapp-env] \$FILE not found — bailing"; exit 1
          fi
          while IFS= read -r line; do
            [ -z "\$line" ] && continue
            key="\${line%%=*}"
            grep -v "^\${key}=" "\$FILE" > "\${FILE}.tmp"
            printf '%s\n' "\$line" >> "\${FILE}.tmp"
            mv "\${FILE}.tmp" "\$FILE"
            echo "[whatsapp-env] upserted \${key} in \$FILE"
          done <<'SNIPPET_EOF'
          ${SNIPPET}SNIPPET_EOF
          REMOTE_SCRIPT

      # NUMU Agent (specs 001/002) — idempotently upsert the agent LLM config
      # into /opt/numu/.env.test. The API key is a GitHub secret; the OpenRouter
      # base URL + model are non-secret literals. Same upsert mechanics as the
      # WhatsApp step above: only non-empty keys are written, so a missing secret
      # never blanks an existing manual entry, and repeated runs converge.
      - name: Sync Agent LLM env vars to test droplet
        env:
          REMOTE_FILE: /opt/numu/.env.test
          AGENT_ENABLED: "true"
          AGENT_LLM_API_KEY: ${{ secrets.TEST_AGENT_LLM_API_KEY }}
          AGENT_LLM_BASE_URL: https://ai-gateway.vercel.sh/v1
          AGENT_LLM_MODEL: alibaba/qwen-3-235b
        run: |
          SNIPPET=""
          for KEY in AGENT_ENABLED AGENT_LLM_API_KEY AGENT_LLM_BASE_URL AGENT_LLM_MODEL; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              SNIPPET+="${KEY}=${VAL}"$'\n'
            else
              echo "[agent-env] $KEY: no value set; leaving .env.test untouched for this key"
            fi
          done
          if [ -z "$SNIPPET" ]; then
            echo "[agent-env] No agent LLM values configured — skipping sync."
            exit 0
          fi
          # See the WhatsApp step for why SNIPPET is embedded in the heredoc
          # rather than piped (pipe + heredoc → heredoc wins, SNIPPET dropped).
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "FILE='${REMOTE_FILE}' bash -s" <<REMOTE_SCRIPT
          set -e
          if [ ! -f "\$FILE" ]; then
            echo "[agent-env] \$FILE not found — bailing"; exit 1
          fi
          while IFS= read -r line; do
            [ -z "\$line" ] && continue
            key="\${line%%=*}"
            grep -v "^\${key}=" "\$FILE" > "\${FILE}.tmp"
            printf '%s\n' "\$line" >> "\${FILE}.tmp"
            mv "\${FILE}.tmp" "\$FILE"
            echo "[agent-env] upserted \${key} in \$FILE"
          done <<'SNIPPET_EOF'
          ${SNIPPET}SNIPPET_EOF
          REMOTE_SCRIPT

      # Embeddings for the assistant's RAG (Step 2). ONLY synced when the API key
      # secret is present — writing AGENT_EMBED_URL without a key would make the
      # HTTP embedder return 401 and break retrieval that currently works on the
      # hash fallback. When the key lands, the embedder signature changes, so the
      # ingest step below re-embeds the corpus automatically on this same deploy.
      - name: Sync Agent embeddings env vars to test droplet
        env:
          REMOTE_FILE: /opt/numu/.env.test
          AGENT_EMBED_API_KEY: ${{ secrets.TEST_AGENT_EMBED_API_KEY }}
          AGENT_EMBED_URL: https://api.deepinfra.com/v1/openai
          AGENT_EMBED_MODEL: intfloat/multilingual-e5-large
        run: |
          if [ -z "$AGENT_EMBED_API_KEY" ]; then
            echo "[agent-embed] TEST_AGENT_EMBED_API_KEY not set — keeping the hash fallback (skipping)."
            exit 0
          fi
          SNIPPET=""
          for KEY in AGENT_EMBED_API_KEY AGENT_EMBED_URL AGENT_EMBED_MODEL; do
            SNIPPET+="${KEY}=${!KEY}"$'\n'
          done
          # See the WhatsApp step for why SNIPPET is embedded in the heredoc.
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "FILE='${REMOTE_FILE}' bash -s" <<REMOTE_SCRIPT
          set -e
          if [ ! -f "\$FILE" ]; then
            echo "[agent-embed] \$FILE not found — bailing"; exit 1
          fi
          while IFS= read -r line; do
            [ -z "\$line" ] && continue
            key="\${line%%=*}"
            grep -v "^\${key}=" "\$FILE" > "\${FILE}.tmp"
            printf '%s\n' "\$line" >> "\${FILE}.tmp"
            mv "\${FILE}.tmp" "\$FILE"
            echo "[agent-embed] upserted \${key} in \$FILE"
          done <<'SNIPPET_EOF'
          ${SNIPPET}SNIPPET_EOF
          REMOTE_SCRIPT

      - name: Deploy to test DO Droplet
        env:
          NUMU_API_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} << DEPLOY_SCRIPT
            set -e
            cd /opt/numu

            echo "==> Authenticating with GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export NUMU_API_IMAGE="${NUMU_API_IMAGE}"
            # Storefront image is required at compose-parse time even though we
            # don't restart it here; default to the test storefront image tag
            # (built by the storefront CD on its own dev push).
            export NUMU_STOREFRONT_IMAGE="\${NUMU_STOREFRONT_IMAGE:-ghcr.io/numu-io/numu-egyptian-bazaar:dev}"

            echo "==> Stopping test app containers to free memory for pull..."
            docker compose -p numu-test --env-file /opt/numu/.env.test \
              -f docker/docker-compose.test.yml stop api celery-worker celery-beat || true

            echo "==> Pruning unused Docker resources..."
            # The Docker daemon serializes prune with a global lock and
            # rejects concurrent callers with "a prune operation is already
            # running" — when two env deploys (or a deploy + the nightly
            # prune cron) overlap, that error kills the run under `set -e`
            # before the pull even starts. Retry up to 5×6s, then continue
            # without prune: the pull will surface real OOM on its own if
            # the box is genuinely out of space.
            for i in 1 2 3 4 5; do
              if docker system prune -f --volumes=false; then break; fi
              echo "[prune] attempt \$i/5 failed (likely concurrent prune) — sleeping 6s..."
              sleep 6
            done

            echo "==> Pulling API image: ${NUMU_API_IMAGE}..."
            docker pull "${NUMU_API_IMAGE}"

            echo "==> Starting test services..."
            docker compose -p numu-test --env-file /opt/numu/.env.test \
              -f docker/docker-compose.test.yml up -d --remove-orphans \
              postgres redis-master minio celery-worker celery-beat api

            echo "==> Running database migrations..."
            docker compose -p numu-test --env-file /opt/numu/.env.test \
              -f docker/docker-compose.test.yml exec -T api alembic upgrade heads

            echo "==> Ingesting NUMU Agent knowledge corpus (Layer A, idempotent)..."
            # Keeps the assistant's knowledge base populated so RAG is never empty.
            # Idempotent (keyed on source + content hash) and non-fatal — a corpus
            # hiccup must never fail an otherwise-healthy API deploy.
            docker compose -p numu-test --env-file /opt/numu/.env.test \
              -f docker/docker-compose.test.yml exec -T api \
              python -m src.infrastructure.agent.knowledge.ingest \
              || echo "[knowledge-ingest] failed — non-fatal, continuing deploy."

            echo "==> Verifying health..."
            sleep 15
            docker exec numu-nginx-staging curl -sf -H "Host: test.numueg.app" -m 8 \
              http://numu-api-test:8000/api/v1/health | grep -q '"success":true' || {
              echo "ERROR: Test health check failed — dumping recent API logs:"
              docker compose -p numu-test --env-file /opt/numu/.env.test \
                -f docker/docker-compose.test.yml logs --tail=80 api
              exit 1
            }

            echo "==> Removing dangling images..."
            docker image prune -f || echo "[image prune] skipped (concurrent prune?) — non-fatal"

            echo "==> Test deployment complete."
          DEPLOY_SCRIPT

  # ===========================================================================
  # Deploy to Stage (DigitalOcean Droplet — staging.numueg.app)
  # Triggers on push to stage branch.
  # Stage stack: project name `numu-stage`, env file /opt/numu/.env.stage,
  # compose docker/docker-compose.stage.yml. Shared nginx in the apex stack
  # routes staging.numueg.app → numu-api-stage via the numu-edge network.
  # ===========================================================================
  deploy-stage:
    name: Deploy to Stage (DO — staging.numueg.app)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/stage'

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Sync files to stage server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} "mkdir -p /opt/numu/docker/postgres"
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "rm -rf /opt/numu/docker/postgres/postgresql.conf /opt/numu/docker/postgres/init-wal-archiving.sh"
          scp -i ~/.ssh/deploy_key \
            docker/docker-compose.stage.yml \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/docker-compose.stage.yml
          scp -i ~/.ssh/deploy_key docker/postgres/postgresql.conf \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/postgres/postgresql.conf
          scp -i ~/.ssh/deploy_key docker/postgres/init-wal-archiving.sh \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }}:/opt/numu/docker/postgres/init-wal-archiving.sh
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "test -f /opt/numu/.env.stage || { echo 'ERROR: /opt/numu/.env.stage not found'; exit 1; }"

      # backend-030 / MVP wiring — same upsert pattern as the test job,
      # reading from STAGE_* secrets and writing to /opt/numu/.env.stage.
      - name: Sync WhatsApp/Meta env vars to stage droplet
        env:
          REMOTE_FILE: /opt/numu/.env.stage
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.STAGE_WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.STAGE_WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.STAGE_WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.STAGE_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.STAGE_WHATSAPP_APP_SECRET }}
          WHATSAPP_ENABLED: ${{ secrets.STAGE_WHATSAPP_ENABLED }}
          META_APP_ID: ${{ secrets.STAGE_META_APP_ID }}
          WHATSAPP_BUSINESS_API_VERSION: v21.0
        run: |
          SNIPPET=""
          for KEY in WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID \
                     WHATSAPP_BUSINESS_ACCOUNT_ID WHATSAPP_WEBHOOK_VERIFY_TOKEN \
                     WHATSAPP_APP_SECRET WHATSAPP_ENABLED META_APP_ID \
                     WHATSAPP_BUSINESS_API_VERSION; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              SNIPPET+="${KEY}=${VAL}"$'\n'
            else
              echo "[whatsapp-env] $KEY: no secret set; leaving .env.stage untouched for this key"
            fi
          done
          if [ -z "$SNIPPET" ]; then
            echo "[whatsapp-env] No WhatsApp/Meta secrets configured for stage — skipping sync."
            exit 0
          fi
          # See note on the test sync step — pipe-to-ssh-with-heredoc
          # drops the SNIPPET silently. Inline it via nested heredoc.
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} \
            "FILE='${REMOTE_FILE}' bash -s" <<REMOTE_SCRIPT
          set -e
          if [ ! -f "\$FILE" ]; then
            echo "[whatsapp-env] \$FILE not found — bailing"; exit 1
          fi
          while IFS= read -r line; do
            [ -z "\$line" ] && continue
            key="\${line%%=*}"
            grep -v "^\${key}=" "\$FILE" > "\${FILE}.tmp"
            printf '%s\n' "\$line" >> "\${FILE}.tmp"
            mv "\${FILE}.tmp" "\$FILE"
            echo "[whatsapp-env] upserted \${key} in \$FILE"
          done <<'SNIPPET_EOF'
          ${SNIPPET}SNIPPET_EOF
          REMOTE_SCRIPT

      - name: Deploy to stage DO Droplet
        env:
          NUMU_API_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_HOST }} << DEPLOY_SCRIPT
            set -e
            cd /opt/numu

            echo "==> Authenticating with GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export NUMU_API_IMAGE="${NUMU_API_IMAGE}"
            export NUMU_STOREFRONT_IMAGE="\${NUMU_STOREFRONT_IMAGE:-ghcr.io/numu-io/numu-egyptian-bazaar:stage}"

            echo "==> Stopping stage app containers..."
            docker compose -p numu-stage --env-file /opt/numu/.env.stage \
              -f docker/docker-compose.stage.yml stop api celery-worker celery-beat || true

            echo "==> Pruning unused Docker resources..."
            # The Docker daemon serializes prune with a global lock and
            # rejects concurrent callers with "a prune operation is already
            # running" — when two env deploys (or a deploy + the nightly
            # prune cron) overlap, that error kills the run under `set -e`
            # before the pull even starts. Retry up to 5×6s, then continue
            # without prune: the pull will surface real OOM on its own if
            # the box is genuinely out of space.
            for i in 1 2 3 4 5; do
              if docker system prune -f --volumes=false; then break; fi
              echo "[prune] attempt \$i/5 failed (likely concurrent prune) — sleeping 6s..."
              sleep 6
            done

            echo "==> Pulling API image: ${NUMU_API_IMAGE}..."
            docker pull "${NUMU_API_IMAGE}"

            echo "==> Starting stage services..."
            docker compose -p numu-stage --env-file /opt/numu/.env.stage \
              -f docker/docker-compose.stage.yml up -d --remove-orphans \
              postgres redis-master minio celery-worker celery-beat api

            echo "==> Running database migrations..."
            docker compose -p numu-stage --env-file /opt/numu/.env.stage \
              -f docker/docker-compose.stage.yml exec -T api alembic upgrade heads

            echo "==> Verifying health..."
            sleep 15
            docker exec numu-nginx-staging curl -sf -H "Host: staging.numueg.app" -m 8 \
              http://numu-api-stage:8000/api/v1/health | grep -q '"success":true' || {
              echo "ERROR: Stage health check failed — dumping recent API logs:"
              docker compose -p numu-stage --env-file /opt/numu/.env.stage \
                -f docker/docker-compose.stage.yml logs --tail=80 api
              exit 1
            }

            echo "==> Removing dangling images..."
            docker image prune -f || echo "[image prune] skipped (concurrent prune?) — non-fatal"

            echo "==> Stage deployment complete."
          DEPLOY_SCRIPT

  # ===========================================================================
  # Deploy API to AWS EC2 (numueg.app prod)
  # Triggers on push to prod branch. Since the 2026-06-28 migration the prod
  # api + celery run on AWS EC2 (eu-west-1) — DB on Supabase, storage on R2,
  # redis local. The compose + .env live on the box at /opt/numu-api and are
  # managed there: CD ships the new image only and does NOT rewrite .env.
  # The droplet still serves the nginx edge + storefronts; its nginx
  # `upstream numu_api` points at this EC2 box (managed manually, not by CD).
  # ===========================================================================
  deploy-apex:
    name: Deploy API to AWS EC2 (numueg.app prod)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Install EC2 SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy api + celery to EC2
        # Unquoted heredoc so GHCR_TOKEN / GHCR_USER expand on the runner
        # before being forwarded over SSH (they are not set on the EC2 box).
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.PROD_EC2_USER }}@${{ secrets.PROD_EC2_HOST }} << DEPLOY_SCRIPT
            set -e
            cd /opt/numu-api

            echo "==> Authenticating with GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            echo "==> Pulling latest api image (:prod)..."
            docker compose pull api

            echo "==> Recreating api + celery with the new image..."
            docker compose up -d api celery-worker celery-beat

            echo "==> Running database migrations (Supabase)..."
            # `heads` (plural), NOT `head`: apply ALL heads so a transient branch
            # point (two migrations off one parent before a merge migration
            # lands) can't hard-fail the deploy with "Multiple head revisions".
            docker compose exec -T api alembic upgrade heads

            echo "==> Verifying health..."
            sleep 12
            curl -sf http://localhost:8000/api/v1/health | grep -q '"success":true' || {
              echo "ERROR: EC2 health check failed — dumping recent API logs:"
              docker compose logs --tail=80 api
              exit 1
            }

            echo "==> Reloading edge nginx so it re-resolves the recreated api container IP..."
            # docker compose up recreates the api container with a NEW docker-network
            # IP; the long-lived edge-nginx caches the old IP in its static upstream
            # and 502s every request until reloaded. Reload re-resolves it.
            docker exec numu-edge-nginx nginx -s reload 2>/dev/null \
              || echo "[edge nginx reload] skipped — numu-edge-nginx not found (non-fatal)"

            echo "==> Pruning dangling images..."
            docker image prune -f || echo "[image prune] skipped — non-fatal"

            echo "==> EC2 prod deployment complete."
          DEPLOY_SCRIPT
