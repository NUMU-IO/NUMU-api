name: Promote

# Promote dev → prod in one click. Staging is intentionally bypassed.
# Pushing `prod` triggers the deploy-apex job in cd.yml (EC2 prod deploy).
on:
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: dev → prod
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune

      - name: Promote dev → prod
        run: |
          echo "==> Promoting prod ← dev"
          git checkout prod
          # Fast-forward when prod is an ancestor of dev (the common case);
          # fall back to a real merge if prod has diverged (e.g. a hotfix
          # landed straight on prod) so the promote never wedges on ff-only.
          git merge --ff-only origin/dev \
            || git merge --no-edit -m "Promote dev → prod" origin/dev
          git push origin prod
