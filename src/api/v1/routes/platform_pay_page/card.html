<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NUMU payment</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; color: #0f172a; background: transparent; }
  [hidden] { display: none !important; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; direction: ltr; background: #fff; }
  input:focus { outline: 2px solid #0f172a; outline-offset: -1px; }
  button { width: 100%; height: 42px; border: 0; border-radius: 8px; background: #0f172a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 11px; color: #64748b; text-align: center; margin-top: 10px; }
  .msg { text-align: center; padding: 32px 8px; }
  .err { color: #b91c1c; }
  iframe { width: 100%; height: 460px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
  <form id="card-form" autocomplete="on" novalidate>
    <div class="field">
      <label for="cc-number" data-t="number"></label>
      <input id="cc-number" inputmode="numeric" autocomplete="cc-number" placeholder="1234 1234 1234 1234" maxlength="23">
    </div>
    <div class="row">
      <div class="field">
        <label for="cc-exp" data-t="expiry"></label>
        <input id="cc-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5">
      </div>
      <div class="field">
        <label for="cc-csc">CVC</label>
        <input id="cc-csc" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4">
      </div>
    </div>
    <div class="field">
      <label for="cc-name" data-t="name"></label>
      <input id="cc-name" autocomplete="cc-name">
    </div>
    <button id="pay" type="submit" disabled></button>
    <p class="note" data-t="note"></p>
  </form>
  <div id="three-ds" hidden></div>
  <p id="status" class="msg" hidden></p>
  <script src="card.js"></script>
</body>
</html>
